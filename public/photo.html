<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Viewer — Payless Fuel Centers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #F0F3FA;
      color: #1B2A4A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      text-align: left;
      background: #1B2A4A;
      border-bottom: 3px solid #C8102E;
      padding: 14px 24px;
      width: 100%;
      max-width: 760px;
      border-radius: 10px 10px 0 0;
    }
    .site-header img {
      width: 52px; height: 52px;
      border-radius: 6px;
      background: #fff;
      object-fit: cover;
    }
    .site-header h1 { font-size: 1rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
    .site-header p  { font-size: 0.78rem; color: rgba(255,255,255,0.6); margin-top: 2px; }

    .photo-card {
      background: #FFFFFF;
      border: 1px solid #D0D8E8;
      border-radius: 0 0 10px 10px;
      overflow: hidden;
      max-width: 760px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(27,42,74,0.12);
    }

    .photo-title {
      background: #1B2A4A;
      padding: 13px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #FFFFFF;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .photo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 260px;
      background: #FFFFFF;
    }

    .photo-wrap img {
      max-width: 100%;
      max-height: 65vh;
      border-radius: 8px;
      object-fit: contain;
      border: 1px solid #D0D8E8;
      box-shadow: 0 2px 12px rgba(27,42,74,0.1);
    }

    /* Signature — white background, show ink clearly */
    .photo-wrap img.sig-img {
      background: #FFFFFF;
      padding: 12px;
      border: 1.5px solid #1B2A4A;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #7B9AC4;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #D0D8E8;
      border-top-color: #1B2A4A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      text-align: center;
      padding: 40px 20px;
      color: #C62828;
    }
    .error .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .error p { font-size: 0.95rem; }
    .error .hint {
      margin-top: 10px;
      font-size: 0.82rem;
      color: #6B7FA8;
    }

    .photo-footer {
      padding: 14px 20px;
      border-top: 1px solid #D0D8E8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #F4F6FA;
      font-size: 0.82rem;
      color: #6B7FA8;
    }

    .btn-download {
      background: #1B2A4A;
      border: none;
      color: #FFFFFF;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-download:hover { background: #263D6B; }

    @media (max-width: 600px) {
      body { padding: 0 0 40px; }
      .site-header { border-radius: 0; }
      .photo-card { border-radius: 0; border-left: none; border-right: none; }
    }
  </style>
</head>
<body>

  <div class="site-header">
    <img src="assets/logo.jpg" alt="Logo" />
    <div>
      <h1>Payless Fuel Centers of Texas</h1>
      <p>Photo Viewer</p>
    </div>
  </div>

  <div class="photo-card">
    <div class="photo-title" id="photo-title">Loading…</div>

    <div class="photo-wrap" id="photo-wrap">
      <div class="loading">
        <div class="spinner"></div>
        <span>Loading photo…</span>
      </div>
    </div>

    <div class="photo-footer">
      <span id="photo-info">—</span>
      <a id="download-btn" class="btn-download" download="photo.jpg">
        ⬇ Download
      </a>
    </div>
  </div>

  <script>
  (() => {
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const type   = params.get('type'); // front | back | signature

    const titleEl    = document.getElementById('photo-title');
    const wrapEl     = document.getElementById('photo-wrap');
    const infoEl     = document.getElementById('photo-info');
    const downloadBtn= document.getElementById('download-btn');

    const LABELS = {
      front:     '📷  License — Front Side',
      back:      '📷  License — Back Side',
      signature: '✍️  Driver Signature'
    };

    titleEl.textContent = LABELS[type] || 'Photo';

    if (!token || !type) {
      showError('Invalid link — token or type is missing.');
      return;
    }

    fetch(`/api/photo?token=${encodeURIComponent(token)}&type=${encodeURIComponent(type)}`)
      .then(r => r.json())
      .then(data => {
        if (!data.image || data.image.length < 50) {
          showError(
            'Photo not found.',
            'This may be an older registration submitted before photos were stored, or the image data was not saved.'
          );
          return;
        }

        const img = document.createElement('img');
        img.src = data.image;
        img.alt = LABELS[type] || 'Photo';
        if (type === 'signature') img.classList.add('sig-img');

        img.onload = () => {
          wrapEl.innerHTML = '';
          wrapEl.appendChild(img);
        };

        img.onerror = () => {
          showError('Could not display image — data may be corrupted.');
        };

        infoEl.textContent = data.driverName
          ? `${data.driverName}${data.truckNumber ? ' — ' + data.truckNumber : ''}`
          : 'Driver photo';

        downloadBtn.href     = data.image;
        downloadBtn.download = `${type}-${token.substring(0, 8)}.jpg`;
      })
      .catch(err => {
        showError('Network error — could not load photo.', err.message);
      });

    function showError(msg, hint) {
      wrapEl.innerHTML = `
        <div class="error">
          <div class="icon">⚠️</div>
          <p>${esc(msg)}</p>
          ${hint ? `<p class="hint">${esc(hint)}</p>` : ''}
        </div>`;
    }

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  })();
  </script>
</body>
</html>

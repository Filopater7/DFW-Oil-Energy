<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payless Fuel Centers of Texas – Verify Parking Pass</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1B2A4A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Payless Fuel" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Capture install prompt ASAP before any other script
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault(); window._pwaPrompt = e;
      var b = document.getElementById('pwa-install-btn');
      if (b) b.hidden = false;
    });
  </script>
  <style>
    .verify-wrap {
      max-width: 540px;
      margin: 0 auto;
      width: 100%;
    }

    /* Status card */
    .status-card {
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 24px;
      animation: slideIn 0.35s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Active (green) */
    .status-card.active {
      border: 2px solid #43A047;
      background: rgba(67,160,71,0.08);
    }
    .status-card.active .status-header {
      background: linear-gradient(90deg, #2E7D32, #43A047);
    }

    /* Expired (red) */
    .status-card.expired {
      border: 2px solid var(--error);
      background: rgba(229,57,53,0.08);
    }
    .status-card.expired .status-header {
      background: linear-gradient(90deg, #b71c1c, var(--error));
    }

    /* Not found (orange) */
    .status-card.not-found {
      border: 2px solid var(--red);
      background: rgba(224,123,32,0.08);
    }
    .status-card.not-found .status-header {
      background: linear-gradient(90deg, #bf360c, var(--red));
    }

    .status-header {
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .status-icon {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .status-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .status-sub {
      font-size: 0.84rem;
      color: rgba(255,255,255,0.8);
      margin-top: 3px;
    }

    /* Driver info grid */
    .driver-info {
      padding: 20px 22px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .info-item {}
    .info-item .info-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .info-item .info-value {
      font-size: 0.97rem;
      font-weight: 600;
      color: var(--text);
    }
    .info-item.full { grid-column: 1 / -1; }

    /* Expiry row */
    .expiry-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 22px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .expiry-row .exp-label { color: var(--muted); }
    .expiry-row .exp-value {
      font-weight: 700;
    }
    .active  .exp-value { color: #81C784; }
    .expired .exp-value { color: #EF9A9A; }

    /* Countdown inside verify */
    .verify-countdown {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 16px 22px;
      border-top: 1px solid var(--border);
    }
    .vc-cell {
      display: flex; flex-direction: column; align-items: center;
      background: #F4F6FA; border: 1px solid var(--border);
      border-radius: 7px; padding: 8px 12px; min-width: 52px;
    }
    .vc-cell .num {
      font-size: 1.4rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent); line-height: 1;
    }
    .vc-cell .unit {
      font-size: 0.65rem; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--muted); margin-top: 3px;
    }

    /* Loading spinner */
    .verify-loading {
      text-align: center;
      padding: 60px 20px;
    }
    .verify-loading .spinner {
      margin: 0 auto 16px;
      border-color: rgba(201,168,76,0.3);
      border-top-color: var(--accent);
      width: 40px; height: 40px;
    }

    .btn-back {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
      margin-top: 12px;
    }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 480px) {
      .info-grid { grid-template-columns: 1fr; }
      .info-item.full { grid-column: 1; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <img src="assets/logo.jpg" alt="Payless Fuel Centers of Texas Logo" class="logo" />
      <div class="header-text">
        <h1>Payless Fuel Centers of Texas</h1>
        <p class="subtitle">Truck Parking Registration — Texas</p>
      </div>
      <button id="pwa-install-btn" class="btn-pwa-install">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        Install App
      </button>
    </div>
  </header>

  <main class="main-content">
    <div class="verify-wrap">

      <!-- Loading -->
      <div class="verify-loading" id="verify-loading">
        <div class="spinner"></div>
        <p style="color:var(--muted);">Verifying driver pass…</p>
      </div>

      <!-- Result (filled by JS) -->
      <div id="verify-result" hidden></div>

    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Payless Fuel Centers of Texas . All rights reserved.</p>
  </footer>

  <script>
  (() => {
    const loadEl = document.getElementById('verify-loading');
    const resEl  = document.getElementById('verify-result');
    const params = new URLSearchParams(window.location.search);

    // ── New QR format: ?d=base64url encoded JSON ──────────────
    const encoded = params.get('d');
    if (encoded) {
      try {
        // Decode base64url → JSON
        const json = atob(encoded.replace(/-/g,'+').replace(/_/g,'/'));
        const r    = JSON.parse(json);

        // Map short keys back to full names
        // st and ex are unix seconds — convert to ms for Date
        const d = {
          token:         r.t,
          companyName:   r.cn,
          driverName:    r.dn,
          driverEmail:   r.de,
          truckNumber:   r.tn,
          phoneNumber:   r.ph,
          startTime:     new Date(r.st * 1000).toLocaleString(),
          startTimeUTC:  new Date(r.st * 1000),
          expiresAt:     new Date(r.ex * 1000),
          durationLabel: r.dl
        };

        // Determine status from timestamps
        const now        = new Date();
        const expired    = now > d.expiresAt;
        const notStarted = now < d.startTimeUTC;
        d.status = notStarted ? 'not_started' : expired ? 'expired' : 'active';

        loadEl.hidden = true;
        resEl.hidden  = false;

        if (d.status === 'active')       renderActive(d);
        else if (d.status === 'expired') renderExpired(d);
        else if (d.status === 'not_started') renderNotStarted(d);

      } catch (err) {
        showError('Invalid QR code. Could not decode pass data.');
      }
      return;
    }

    // ── Legacy format: ?token= (no longer issued, show not found) ──
    showError('Invalid or outdated QR code. Please generate a new one.');

    // ── ACTIVE ────────────────────────────────────────────────
    function renderActive(d) {
      const expiresAt = d.expiresAt; // already a Date object
      resEl.innerHTML = `
        <div class="status-card active">
          <div class="status-header">
            <div class="status-icon">✓</div>
            <div>
              <div class="status-title">PASS VALID</div>
              <div class="status-sub">This driver is authorized for truck parking</div>
            </div>
          </div>
          <div class="driver-info">
            <div class="info-grid">
              <div class="info-item"><div class="info-label">Driver Name</div><div class="info-value">${esc(d.driverName)}</div></div>
              <div class="info-item"><div class="info-label">Company</div><div class="info-value">${esc(d.companyName)}</div></div>
              <div class="info-item"><div class="info-label">Truck Number</div><div class="info-value">${esc(d.truckNumber)}</div></div>
              <div class="info-item"><div class="info-label">Phone</div><div class="info-value">${esc(d.phoneNumber)}</div></div>
              <div class="info-item"><div class="info-label">Start Time</div><div class="info-value">${esc(d.startTime)}</div></div>
              <div class="info-item"><div class="info-label">Parking Duration</div><div class="info-value">${esc(d.durationLabel)}</div></div>
            </div>
          </div>
          <div class="expiry-row">
            <span class="exp-label">Pass expires</span>
            <span class="exp-value">${d.expiresAt.toLocaleString()}</span>
          </div>
          <div class="verify-countdown" id="countdown-row">
            <div class="vc-cell"><span class="num" id="vd">--</span><span class="unit">Days</span></div>
            <div class="vc-cell"><span class="num" id="vh">--</span><span class="unit">Hrs</span></div>
            <div class="vc-cell"><span class="num" id="vm">--</span><span class="unit">Min</span></div>
            <div class="vc-cell"><span class="num" id="vs">--</span><span class="unit">Sec</span></div>
          </div>
        </div>
        <a href="index.html" class="btn-back">← Back to Parking Registration</a>
      `;

      function pad(n) { return String(n).padStart(2,'0'); }
      function tick() {
        const diff = d.expiresAt - Date.now();
        if (diff <= 0) {
          document.getElementById('countdown-row').innerHTML =
            '<p style="color:var(--error);font-weight:700;padding:8px;">Pass just expired</p>';
          document.querySelector('.status-card').className = 'status-card expired';
          return;
        }
        const s = Math.floor(diff / 1000);
        document.getElementById('vd').textContent = pad(Math.floor(s / 86400));
        document.getElementById('vh').textContent = pad(Math.floor((s % 86400) / 3600));
        document.getElementById('vm').textContent = pad(Math.floor((s % 3600) / 60));
        document.getElementById('vs').textContent = pad(s % 60);
      }
      tick();
      setInterval(tick, 1000);
    }

    function renderExpired(d) {
      resEl.innerHTML = `
        <div class="status-card expired">
          <div class="status-header">
            <div class="status-icon">✗</div>
            <div>
              <div class="status-title">PASS EXPIRED</div>
              <div class="status-sub">This driver's parking period has ended</div>
            </div>
          </div>
          <div class="driver-info">
            <div class="info-grid">
              <div class="info-item"><div class="info-label">Driver Name</div><div class="info-value">${esc(d.driverName)}</div></div>
              <div class="info-item"><div class="info-label">Company</div><div class="info-value">${esc(d.companyName)}</div></div>
              <div class="info-item"><div class="info-label">Truck Number</div><div class="info-value">${esc(d.truckNumber)}</div></div>
              <div class="info-item"><div class="info-label">Phone</div><div class="info-value">${esc(d.phoneNumber)}</div></div>
              <div class="info-item full"><div class="info-label">Parking was</div>
                <div class="info-value">${esc(d.durationLabel)} from ${esc(d.startTime)}</div>
              </div>
            </div>
          </div>
          <div class="expiry-row">
            <span class="exp-label">Expired on</span>
            <span class="exp-value">${d.expiresAt.toLocaleString()}</span>
          </div>
        </div>
        <p style="text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:12px;">
          Driver must submit a new parking registration to get an active pass.
        </p>
        <a href="index.html" class="btn-back">← Back to Parking Registration</a>
      `;
    }

    // ── NOT STARTED ───────────────────────────────────────────
    function renderNotStarted(d) {
      resEl.innerHTML = `
        <div class="status-card not-found" style="border-color:#1565C0;background:rgba(21,101,192,0.08);">
          <div class="status-header" style="background:linear-gradient(90deg,#0d47a1,#1565C0);">
            <div class="status-icon">⏳</div>
            <div>
              <div class="status-title">PARKING NOT STARTED</div>
              <div class="status-sub">This pass is valid but the parking period hasn't started yet</div>
            </div>
          </div>
          <div class="driver-info">
            <div class="info-grid">
              <div class="info-item"><div class="info-label">Driver Name</div><div class="info-value">${esc(d.driverName)}</div></div>
              <div class="info-item"><div class="info-label">Company</div><div class="info-value">${esc(d.companyName)}</div></div>
              <div class="info-item"><div class="info-label">Truck Number</div><div class="info-value">${esc(d.truckNumber)}</div></div>
              <div class="info-item"><div class="info-label">Phone</div><div class="info-value">${esc(d.phoneNumber)}</div></div>
              <div class="info-item full"><div class="info-label">Parking Starts</div>
                <div class="info-value" style="color:#64B5F6;">${esc(d.startTime)}</div>
              </div>
            </div>
          </div>
          <div class="expiry-row">
            <span class="exp-label">Parking duration</span>
            <span class="exp-value" style="color:#64B5F6;">${esc(d.durationLabel)}</span>
          </div>
        </div>
        <p style="text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:12px;">
          This pass will become active when the parking period starts.
        </p>
        <a href="index.html" class="btn-back">← Back to Parking Registration</a>
      `;
    }

    function showError(msg) {
      loadEl.hidden = true;
      resEl.hidden  = false;
      resEl.innerHTML = `
        <div class="status-card not-found">
          <div class="status-header">
            <div class="status-icon">?</div>
            <div>
              <div class="status-title">PASS NOT FOUND</div>
              <div class="status-sub">${esc(msg)}</div>
            </div>
          </div>
        </div>
        <a href="index.html" class="btn-back" style="margin-top:12px;">← Back to Parking Registration</a>
      `;
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  })();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
